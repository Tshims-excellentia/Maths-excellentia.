<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Préparation Excellentia 2026 — Mathématiques</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #0757a6;
    --blue-light: #0878c9;
    --blue-dark: #043c75;
    --green: #18a66a;
    --green-light: #e0f8ec;
    --white: #ffffff;
    --text: #10243e;
    --muted: #66788c;
    --background: #eef6ff;
    --danger: #d83b3b;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            #d8ecff,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            #dff8eb,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f8fcff,
            #edf6ff,
            #f7fffb
        );
}

/* ================= HEADER ================= */

header {
    background: linear-gradient(
        135deg,
        var(--blue-dark),
        var(--blue-light)
    );

    color: white;
    padding: 20px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.15);
}

.header-content {
    max-width: 1050px;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 15px;
}

.logo {
    width: 55px;
    height: 55px;

    border-radius: 15px;

    background: white;
    color: var(--blue);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;
    font-weight: 900;
}

.header-title h1 {
    font-size: 21px;
}

.header-title p {
    margin-top: 5px;
    opacity: 0.9;
}

/* ================= MAIN ================= */

main {
    max-width: 1050px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: rgba(255,255,255,0.97);

    border-radius: 25px;

    padding: 30px;

    box-shadow:
        0 15px 45px rgba(20,65,105,0.12);

    border: 1px solid rgba(7,87,166,0.08);
}

/* ================= ACCUEIL ================= */

.hero {
    text-align: center;
    padding: 45px 30px;
}

.math-icon {
    font-size: 60px;
}

.hero h2 {
    font-size: 32px;
    margin: 15px 0;
}

.hero h2 span {
    color: var(--blue);
}

.hero-description {
    max-width: 750px;
    margin: auto;

    color: var(--muted);
    line-height: 1.7;

    font-size: 16px;
}

/* ================= BADGES ================= */

.badges {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 10px;

    margin: 25px 0;
}

.badge {
    padding: 10px 15px;

    border-radius: 50px;

    background: #eaf4ff;

    color: var(--blue);

    font-size: 13px;
    font-weight: bold;
}

.badge.green {
    background: var(--green-light);
    color: #11764b;
}

/* ================= STATISTIQUES ACCUEIL ================= */

.home-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin: 25px 0;
}

.home-box {
    background: #f6faff;

    border-radius: 15px;

    padding: 17px;

    text-align: center;
}
